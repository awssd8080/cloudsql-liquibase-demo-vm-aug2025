name: Stage Deploy

on:
  push:
    branches: [ "stage" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Copy Liquibase files to VM
      run: |
        echo "Copying db directory to VM..."
        gcloud compute scp --recurse ./db github-actions@liquibase-vm:/opt/liquibase-project \
          --zone=us-central1-a \
          --tunnel-through-iap \
          --project=sd-liqui-dev

    - name: Run Liquibase on VM
      uses: google-github-actions/ssh-compute@v1
      with:
        instance_name: liquibase-vm
        zone: us-central1-a
        user: github-actions
        project_id: sd-liqui-dev
        ssh_private_key: ${{ secrets.IAP_SSH_PRIVATE_KEY }}
        command: |
          bash -lc '
            set -e
            cd /opt/liquibase-project
            liquibase \
              --url="jdbc:postgresql://172.16.128.5:5432/stage_db" \
              --username=${{ secrets.DB_USER }} \
              --password=${{ secrets.DB_PASS }} \
              --changelog-file=db/changelog-master.xml \
              update
          '
