name: Liquibase deploy via IAP SSH

on:
  push:
    branches: stage

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Auth to GCP using SA key
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2) Install gcloud
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 3) (Optional) Make project explicit
      - name: Set project
        run: gcloud config set project sd-liqui-dev

      # 4) SSH to VM over IAP and run Liquibase
      - name: Deploy via IAP SSH
        uses: google-github-actions/ssh-compute@v1
        with:
          project_id: sd-liqui-dev
          zone: us-central1-a
          instance_name: liquibase-vm
          ssh_username: ${{ secrets.IAP_USER }}          # e.g., liquibase-poc
          ssh_private_key: ${{ secrets.IAP_SSH_PRIVATE_KEY }}
          ssh_extra_args: --tunnel-through-iap
          command: |
            export CLASSPATH=./postgresql.jar
            liquibase \
              --url="${{ secrets.DB_URL }}" \
              --username="${{ secrets.DB_USERNAME }}" \
              --password="${{ secrets.DB_PASSWORD }}" \
              --driver=org.postgresql.Driver \
              --changelog-file=db/changelog-master.xml \
              update
