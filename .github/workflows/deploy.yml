on:
  push:
    branches: ["main"]

jobs:
  liquibase-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.SERVICE_ACCOUNT_JSON }}'

    - name: SSH into VM and run Liquibase
      uses: google-github-actions/ssh-compute@v0
      with:
        instance_name: ${{ secrets.VM_NAME }}
        zone: ${{ secrets.VM_ZONE }}
        ssh_private_key: ${{ secrets.SSH_KEY }}
        command: |
          cd /home/sreekanth/cloudsql-liquibase-demo-vm-aug2025
          export CLASSPATH=./postgresql.jar
          liquibase \
            --url="jdbc:postgresql://${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}" \
            --username=${{ secrets.DB_USER }} \
            --password=${{ secrets.DB_PASS }} \
            --driver=org.postgresql.Driver \
            --changelog-file=db/changelog-master.xml \
            update
```
